services:
  dm-overlord:
    # Pull from GHCR
    image: ghcr.io/lammy93/dm-overlord:latest
    # To build locally:
    # build: .

    container_name: dm-overlord
    restart: unless-stopped

    # Point to your .env file location (change path if needed)
    env_file: ${ENV_FILE:-./.env}

    ports:
      - "3049:3049"

    environment:
      # These defaults are used if not set in your env_file
      - WEB_PORT=3049
      - WEB_HOST=0.0.0.0
      - NARRATION_STYLE=descriptive
      - LOG_LEVEL=info
      - AI_MODEL=gpt-4o-mini
      - OBSIDIAN_VAULT_PATH=/vault
      - OBSIDIAN_SUBFOLDER=DM-Overlord
      - DATABASE_PATH=/app/data/dm-overlord.db

    volumes:
      # Persist database between restarts
      - ./data:/app/data
      # Optional: mount your Obsidian vault (remove if not using)
      # - /path/to/your/obsidian-vault:/vault:ro
